<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Desktop computer</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(900px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>
.pc-clip{overflow:hidden}
.pc-stage{position:relative;touch-action:pan-y;outline:none}
@media (max-width:560px){.pc-stage{width:116%;margin-left:-8%}}
.pc-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.pc-stage>svg,.pc-stage>canvas{display:block;width:100%;height:auto}
.pc-stage>.pc-layer,.pc-stage>.pc-gl{position:absolute;inset:0;height:100%!important;pointer-events:none}
.iso:not([data-theme="light"]) .pc-gl{mix-blend-mode:screen}
.pc-tower{pointer-events:visiblePainted}
.pc-well{fill:var(--anatomy-shade-0)}
.pc-hole{fill:var(--anatomy-shade-0)}
.pc-pcb{fill:var(--anatomy-shade-1)}
.pc-face{fill:var(--anatomy-top)}
.pc-hub{fill:var(--anatomy-top)}
.pc-glass{fill:var(--anatomy-shade-0);transition:fill .5s var(--anatomy-ease)}
.pc-glass[data-on]{fill:var(--anatomy-lit-shade)}
.pc-blade{fill:var(--anatomy-shade-3);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linejoin:round}
.pc-blur{fill:var(--anatomy-shade-2);opacity:0}
.pc-rgb{fill:none;stroke:var(--anatomy-faint);stroke-width:1.5px;vector-effect:non-scaling-stroke}
.pc-rgb-fill{fill:var(--anatomy-faint);stroke:none}
.pc-ring{fill:none;stroke:var(--anatomy-faint);stroke-width:1.3px;vector-effect:non-scaling-stroke}
.pc-hit{fill:transparent;pointer-events:all}
.pc-led-dot{fill:var(--anatomy-faint);transition:fill .4s var(--anatomy-ease)}
.pc-power{cursor:pointer}
.pc-sleeve{fill:none;stroke:var(--anatomy-mid);stroke-linecap:round;stroke-linejoin:round}
.pc-core{fill:none;stroke:var(--anatomy-shade-2);stroke-linecap:round;stroke-linejoin:round}
.pc-text{fill:var(--anatomy-lit);font-family:var(--anatomy-mono);letter-spacing:.02em}
.pc-text[data-tone="dim"]{fill:var(--anatomy-mid)}
.pc-bar{fill:var(--anatomy-lit);opacity:.9}
.pc-graph{fill:none;stroke:var(--anatomy-lit);stroke-width:1.1px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.pc-content{transition:opacity .4s var(--anatomy-ease)}
.pc-key,.pc-tower [data-part="tower"]{cursor:pointer}
.pc-key[data-down] .iso-edge{stroke:var(--anatomy-hi)}
[data-part="monitor"]{cursor:pointer}
[data-part="led"]{transition:opacity .4s var(--anatomy-ease)}
.pc-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.pc-fallback{opacity:.55}
.pc-stage[data-gl] .pc-fallback{display:none}

ep through loads: the monitor reads CPU and GPU load, fan speed and wall power, and everything is computed from one small thermal model. Watts become heat, heat becomes temperature through each heatsink, and the fan curves answer with speed: the graphics card's fans stay stopped until it passes 52 °C. The air that crosses the board is drawn from the case's real airflow and warms as it goes. Temperatures in the readout are CPU / GPU. Space switches the machine off; the fans spin down and the light fades.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);

function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];

function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);

function runsOf(flags, want) {

    let run = null;
    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;

const gpuRpm = (t, running = false) => ((running ? t < GPU_FAN.zeroBelow - 8 : t < GPU_FAN.zeroBelow) ? 0 : 900 + 1700 * mSmooth(GPU_FAN.zeroBelow, 84, t));

// Instantaneous equilibrium temperatures for given fan speeds.

// Where everything settles if you wait long enough.

function initial() {

// Advance the lagging state: temperatures follow heat capacity, fans follow their controllers.
function step(state, load, on, dt) {

  state.cpu = follow(state.cpu, eq.cpu, 2.4);

const D = {"W":820,"H":560,"P":{"origin":[408.5374582736801,384.0082697942614],"scale":1.0529694980154265,"azimuth":60,"elevation":30},"camera":{"origin":[408.5374582736801,384.0082697942614],"k":1.3319127681651584,"cam":[0.8660254037844386,0.5000000000000001,0.49999999999999994,0.8660254037844387]},"fans":[{"id":"gpu1","group":"gpu","cx":-128,"cy":-80,"r":22.5},{"id":"gpu2","group":"gpu","cx":-176,"cy":-80,"r":22.5},{"id":"cpu","group":"cpu","cx":20,"cy":-146,"r":18},{"id":"rear","group":"case","cx":0,"cy":-165,"r":20},{"id":"top1","group":"case","cx":-116,"cy":0,"r":24},{"id":"top2","group":"case","cx":-176,"cy":0,"r":24}],"keys":["`","1","2","3","4","5","6","7","8","9","0","-","=","Backspace","Tab","q","w","e","r","t","y","u","i","o","p","[","]","\\","CapsLock","a","s","d","f","g","h","j","k","l",";","'","Enter","Shift","z","x","c","v","b","n","m",",",".","/","ShiftRight","Alt","Meta"," ","NumpadEnter","AltRight"],"tray":{"y":-41.35,"x0":-205,"x1":-15,"z0":9,"z1":233},"sources":[{"id":"gpu1","p":[-128,-4,80],"act":0},{"id":"gpu2","p":[-176,-4,80],"act":1},{"id":"cpu","p":[-182.5,-20,146],"act":2},{"id":"top1","p":[-116,0,234],"act":3},{"id":"top2","p":[-176,0,234],"act":4},{"id":"rear","p":[-197,0,165],"act":5},{"id":"ram","p":[-129,-33,180.5],"act":6}],"mon":{"x0":29,"x1":175,"z0":85,"z1":171},"graph":{"x0":34,"x1":170,"z0":90,"z1":110},"bar":{"x0":46.8,"x1":138.2}};
const P = D.P;
const stage = document.querySelector(".pc-stage");
const q = (selector) => stage.querySelector(selector);
const qa = (selector) => [...stage.querySelectorAll(selector)];
const readout = document.querySelector("[data-readout]");
const statusEl = document.querySelector("[data-status]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const LIGHT = document.body.dataset.theme === "light" ? 1 : 0;
const MAX_RPM = { gpu: 2600, cpu: 1600, case: 1500 };

// ---------------------------------------------------------------- the machine's state
let loadIndex = 0;
let power = 1;
let model = (() => {
  const s = steady(LOADS[0]);
  return { cpu: s.cpu, gpu: s.gpu, air: s.air, rpm: { ...s.rpm }, cfm: s.cfm, watts: s.watts };
})();
const shown = { cpu: LOADS[0].cpu, gpu: LOADS[0].gpu }; // utilisation, eased
const glow = { x: 1, v: 0 };
const flow = { x: 0, v: 0 };
const heat = { x: 0, v: 0 };
let hueClock = 0.1;
let flowPhase = 0;
let clock = 0;

// ---------------------------------------------------------------- fans
const fans = D.fans.map((fan, index) => ({
  ...fan,
  index,
  angle: (index * 37) % 360,
  rot: q('[data-rot="' + fan.id + '"]'),
  blur: q('[data-blur="' + fan.id + '"]'),
  rgb: q('[data-rgb="' + fan.id + '"]'),
}));
const rgbLines = qa("[data-rgbline]");
const ledRing = q('[data-led="ring"]');
const ledFront = q('[data-led="front"]');
const monLed = q('[data-part="led"]');
const color = (hue, alpha) => "hsl(" + Math.round(hue * 360) + " 85% " + (LIGHT ? 46 : 64) + "% / " + alpha.toFixed(2) + ")";

// ---------------------------------------------------------------- the monitor
const content = q('[data-part="content"]');
const glass = q(".pc-glass");
const modeText = q('[data-part="mode"]');
const graph = q('[data-part="graph"]');
const bars = Object.fromEntries(qa("[data-bar]").map((el) => [el.dataset.bar, el]));
const values = Object.fromEntries(qa("[data-val]").map((el) => [el.dataset.val, el]));
const history = [];
let historyClock = 0;
const BAR_W = D.bar.x1 - D.bar.x0;
function setText(el, text) {
  if (el.textContent !== text) el.textContent = text;
}
function drawScreen() {
  const on = power || model.rpm.case > 5 || model.watts.wall > 1;
  const wall = model.watts.wall;
  bars.CPU.setAttribute("width", Math.max(0, shown.cpu * BAR_W).toFixed(1));
  bars.GPU.setAttribute("width", Math.max(0, shown.gpu * BAR_W).toFixed(1));
  const fastest = Math.max(model.rpm.case, model.rpm.cpu, model.rpm.gpu);
  bars.FAN.setAttribute("width", Math.max(0, (fastest / 2600) * BAR_W).toFixed(1));
  bars.PWR.setAttribute("width", Math.max(0, Math.min(1, wall / 520) * BAR_W).toFixed(1));
  setText(values.CPU, Math.round(shown.cpu * 100) + "% " + Math.round(model.cpu) + "°");
  setText(values.GPU, Math.round(shown.gpu * 100) + "% " + Math.round(model.gpu) + "°");
  setText(values.FAN, Math.round(fastest / 10) * 10 + " rpm");
  setText(values.PWR, Math.round(wall) + " W");
  setText(modeText, power ? LOADS[loadIndex].name : "off");
  const gx0 = D.graph.x0, gx1 = D.graph.x1, gz0 = D.graph.z0, gz1 = D.graph.z1;
  const n = history.length;

  for (let i = 0; i < n; i++) {
    const x = gx1 - (n - 1 - i) * ((gx1 - gx0) / 59);
    const z = gz0 + 0.6 + Math.min(1, history[i] / 520) * (gz1 - gz0 - 1.2);
    d += (i ? "L" : "M") + x.toFixed(1) + " " + (-z).toFixed(1);
  }
  graph.setAttribute("d", d);
  glass.toggleAttribute("data-on", !!power);
  content.style.opacity = power ? "1" : "0";
  monLed.style.opacity = power ? "" : "0.15";

// ---------------------------------------------------------------- the shader
const FRAGMENT = `
uniform vec3 uSrc[7];
uniform float uAct[7];
uniform float uGlow;
uniform float uHue;
uniform float uFlow;
uniform float uPhase;
uniform float uHeat;
uniform float uLight;
const float PY=${D.tray.y.toFixed(2)};
const vec4 BOX=vec4(${D.tray.x0.toFixed(1)},${D.tray.x1.toFixed(1)},${D.tray.z0.toFixed(1)},${D.tray.z1.toFixed(1)});
vec3 hue(float h){vec3 p=abs(fract(vec3(h)+vec3(0.,.6666667,.3333333))*6.-3.);return clamp(p-1.,0.,1.);}
void main(){
  vec2 vb=viewOf(gl_FragCoord.xy);
  vec3 p=onWallY(vb,PY);
  float px=pixelOf();
  float pz=px/uCam.w;
  float m=smoothstep(BOX.x,BOX.x+7.,p.x)*(1.-smoothstep(BOX.y-7.,BOX.y,p.x))*smoothstep(BOX.z,BOX.z+7.,p.z)*(1.-smoothstep(BOX.w-9.,BOX.w,p.z));
  // light from the fans and strips falling on the tray
  vec3 pool=vec3(0.);
  for(int i=0;i<7;i++){
    vec3 d=uSrc[i]-p;
    float r2=dot(d,d);
    float e=uAct[i]*max(d.y,0.)/pow(r2+260.,1.5);
    pool+=hue(fract(uHue+float(i)*.137+p.x*.0042))*e;

  float h2=hash12(vec2(id,9.1));

  canvas: q(".pc-gl"),
  fragment: FRAGMENT,
  view: [D.W, D.H],
  camera: D.camera,
  uniforms: ["uAct", "uGlow", "uHue", "uFlow", "uPhase", "uHeat"],

if (layer) stage.setAttribute("data-gl", "");
const act = new Float32Array(7);

// ---------------------------------------------------------------- keyboard
const KEYS = D.keys;
const keyEls = KEYS.map((_, i) => q('[data-key="' + i + '"]'));
const keyState = KEYS.map(() => ({ at: 0, held: 0 }));
const activeKeys = new Set();
const down = axisVector(P, [0, 0, -1]);
const DOWN = 2.2;
function press(code, hold = 0.12) {
  const i = KEYS.indexOf(code);
  if (i < 0) return;
  keyState[i].held = hold;
  activeKeys.add(i);
  run();
}

// ---------------------------------------------------------------- control
let visible = false;
let frame = 0;
let previous = 0;
let touring = !still.matches;
let idleTimer = 0;
const TOUR = [[0, 3.6], [1, 3.6], [2, 10], [3, 10], [1, 4]];
let tourAt = 0;
let tourWait = 3.2;

function announce() {
  const text = power ? "Load: " + LOADS[loadIndex].name + "." : "Computer off.";
  if (statusEl.textContent !== text) statusEl.textContent = text;
}
function setLoad(index) {
  loadIndex = (index + LOADS.length) % LOADS.length;
  announce();
  run();
}
function setPower(next) {
  power = next ? 1 : 0;
  announce();
  run();
}
function takeOver() {
  touring = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (still.matches) return;
    touring = true;
    tourWait = 1.5;
    run();
  }, 12000);

function tick(now) {

  previous = now;
  const calm = still.matches;

  if (calm) {
    const s = steady(load);

    history.push(model.watts.wall);

  let spinning = false;

    const norm = rpm / MAX_RPM[fan.group];
    const speed = Math.min(380, (rpm / 1500) * 330);
    if (!calm) fan.angle = (fan.angle + speed * dt) % 360;
    fan.rot.setAttribute("transform", "rotate(" + fan.angle.toFixed(1) + " " + fan.cx + " " + fan.cy + ")");
    const blurAmount = Math.min(1, norm * 1.7);
    fan.blur.style.opacity = (blurAmount * 0.55).toFixed(2);
    fan.rot.style.opacity = (1 - blurAmount * 0.6).toFixed(2);
    const hueOf = (hueClock + fan.index * 0.11) % 1;
    const alpha = glow.x * (0.45 + 0.55 * Math.min(1, norm * 1.4 + 0.2));

  }
  rgbLines.forEach((line, index) => {
    const alpha = glow.x * 0.9;
    line.style.fill = alpha > 0.02 ? color((hueClock + 0.5 + index * 0.09) % 1, alpha) : "";

  ledFront.style.fill = power ? "var(--anatomy-lit)" : "";

  for (const i of activeKeys) {
    const s = keyState[i];
    s.held = Math.max(0, s.held - dt);
    const want = s.held > 0 ? DOWN : 0;

    if (Math.abs(want - s.at) < 0.01) s.at = want;
    keyEls[i].setAttribute("transform", "translate(" + (down[0] * s.at).toFixed(2) + " " + (down[1] * s.at).toFixed(2) + ")");
    keyEls[i].toggleAttribute("data-down", s.at > 0.6);
    if (!s.held && s.at === 0) activeKeys.delete(i);
  }

  drawScreen();
  const text = power
    ? LOADS[loadIndex].name + " · " + Math.round(model.watts.wall) + " W · " + Math.round(model.cpu) + "° / " + Math.round(model.gpu) + "° · " + Math.round(Math.max(model.rpm.case, model.rpm.cpu, model.rpm.gpu) / 10) * 10 + " rpm"
    : "off · " + (model.rpm.case > 5 || model.cpu > AMBIENT + 4 ? "cooling · " + Math.round(model.cpu) + "°" : "0 W");
  if (readout.textContent !== text) readout.textContent = text;

  if (layer) {
    const lit = glow.x > 0.003;
    for (let i = 0; i < 7; i++) {
      const group = ["gpu", "gpu", "cpu", "case", "case", "case", "case"][i];
      const rpm = i === 6 ? 1500 : model.rpm[group];
      act[i] = i === 6 ? 0.35 : 0.5 + 0.5 * Math.min(1, (rpm / MAX_RPM[group]) * 1.5 + 0.2);
    }
    if (lit || flow.x > 0.003) layer.draw({ uAct: act, uGlow: glow.x, uHue: hueClock, uFlow: flow.x, uPhase: flowPhase, uHeat: heat.x }, calm ? 0.8 : clock);
    else layer.clear();
  }

  const busy = touring || power || spinning || activeKeys.size || glowMoving || flowMoving || heatMoving || model.cpu > AMBIENT + 3.5 || model.gpu > AMBIENT + 3.5;
  frame = visible && busy && !calm ? requestAnimationFrame(tick) : 0;
}
function run() {
  if (!frame && visible) {
    previous = 0;
    frame = requestAnimationFrame(tick);
  }
}

new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}, { rootMargin: "120px 0px" }).observe(stage);

stage.addEventListener("keydown", (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  const key = event.key;
  if (key === "Tab") return;
  takeOver();
  const digit = "1234".indexOf(key);
  if (digit >= 0) {
    event.preventDefault();
    press(key);
    if (!power) setPower(1);
    setLoad(digit);
    return;
  }
  if (key === " ") { event.preventDefault(); press(" "); setPower(!power); return; }
  if (key === "Escape") { event.preventDefault(); setPower(0); return; }
  if (key === "ArrowRight" || key === "ArrowUp") { event.preventDefault(); setLoad(loadIndex + 1); return; }
  if (key === "ArrowLeft" || key === "ArrowDown") { event.preventDefault(); setLoad(loadIndex - 1); return; }
  if (key.length === 1) press(key.toLowerCase());
  else if (key === "Enter") press("Enter");
  else if (key === "Backspace") press("Backspace");
});
stage.addEventListener("click", (event) => {
  const target = event.target;
  stage.focus({ preventScroll: true });
  if (target.closest("[data-power]")) { takeOver(); setPower(!power); return; }
  const key = target.closest("[data-key]");
  if (key) {
    takeOver();
    const code = KEYS[Number(key.dataset.key)];
    press(code);
    const digit = "1234".indexOf(code);
    if (digit >= 0) { if (!power) setPower(1); setLoad(digit); }
    else if (code === " ") setPower(!power);
    return;
  }
  if (target.closest('[data-part="monitor"]') || target.closest('[data-part="tower"]')) {
    takeOver();
    if (!power) setPower(1);
    else setLoad(loadIndex + 1);
  }
});

for (let i = 0; i < 60; i++) history.push(model.watts.wall);
announce();
drawScreen();
tick(performance.now());
